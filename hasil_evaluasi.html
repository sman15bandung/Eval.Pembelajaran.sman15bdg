<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Evaluasi Pembelajaran - SMAN 15 Bandung</title>
<link rel="stylesheet" href="tailwind.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
  @media print {
    @page { size: A4; margin: 14mm; }
    header.app-header, .no-print { display: none !important; }
    body, #page { background: #fff !important; }
    #printHeader { display: flex !important; }
    #page > main > div { box-shadow: none !important; }
    tr, canvas { break-inside: avoid; }
    thead { display: table-header-group; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body class="text-slate-800 antialiased">
<div id="page" class="min-h-screen bg-slate-100 pb-12">
  <header class="app-header bg-slate-900 text-white py-5 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center gap-3">
      <div class="bg-indigo-500 p-2 rounded-lg">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight">Hasil Evaluasi Pembelajaran</h1>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-8 space-y-8">
    <!-- Kop laporan (hanya tampil saat dicetak) -->
    <div id="printHeader" class="hidden items-center gap-4 border-b-2 border-slate-300 pb-3">
      <img src="logo-sekolah.png" alt="" class="h-16 w-auto" onerror="this.style.display='none'">
      <div>
        <h1 class="text-xl font-extrabold text-slate-900">Laporan Hasil Evaluasi Pembelajaran Guru</h1>
        <p class="text-sm font-semibold text-slate-600">SMA Negeri 15 Bandung</p>
        <p id="printDate" class="text-xs font-medium text-slate-500"></p>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="no-print flex flex-wrap items-center gap-4 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
      <button onclick="cetakPDF()" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-700 transition-colors">🖨️ Cetak / Simpan PDF</button>
      <button onclick="load()" class="px-5 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-colors">🔄 Muat Ulang Data</button>
      <select id="filterKelas" class="px-4 py-2.5 border border-slate-300 rounded-xl bg-white font-semibold text-slate-700 outline-none focus:ring-4 focus:ring-indigo-500/20"></select>
      <span id="status" class="text-xs font-medium text-slate-400"></span>
    </div>

    <!-- Ringkasan -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 sm:p-6"><p class="text-xs font-bold uppercase tracking-wider text-slate-400">Skor rata-rata</p><p id="sumAvg" class="text-3xl font-extrabold text-indigo-600 mt-1">-</p></div>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 sm:p-6"><p class="text-xs font-bold uppercase tracking-wider text-slate-400">Jumlah penilaian</p><p id="sumCount" class="text-3xl font-extrabold text-slate-700 mt-1">-</p></div>
    </div>

    <!-- Grafik + interpretasi -->
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-slate-800 mb-6">Grafik Kinerja Mata Pelajaran</h2>
      <div id="chartWrap" class="w-full max-w-4xl mx-auto mb-8 relative" style="height:260px"><canvas id="chart"></canvas></div>
      <div class="bg-indigo-50/50 border border-indigo-100 p-5 sm:p-6 rounded-2xl">
        <h3 class="font-bold text-indigo-900 mb-3">Interpretasi Sistem (Otomatis):</h3>
        <div id="interpretasi" class="text-slate-700 leading-relaxed text-sm sm:text-base">Memuat data…</div>
      </div>
    </div>

    <!-- Tabel -->
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-slate-800 mb-6">Tabel Rata-rata Skor</h2>
      <div class="overflow-x-auto rounded-xl border border-slate-100">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-50 text-slate-600 uppercase tracking-wider text-left">
            <tr><th class="px-5 py-3 font-bold">Kelas</th><th class="px-5 py-3 font-bold">Mata Pelajaran</th><th class="px-5 py-3 font-bold text-center">Jumlah Responden</th><th class="px-5 py-3 font-bold text-center">Skor Rata-rata (/5)</th></tr>
          </thead>
          <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://tjfmiqdbijppkhimywrd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZm1pcWRiaWpwcGtoaW15d3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MzQ3NzcsImV4cCI6MjEwODQxMDc3N30.wIGUYbV1pnyyNc7M_IR3JluBU8YgwZtY9OpZ_W_jkPk';
// Hanya tampilkan mapel yang sudah dinilai minimal sekian orang (naikkan agar lebih terjaga, mis. 3 atau 5)
const MIN_RESPONDEN = 1;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [], chart = null;
const sel = document.getElementById('filterKelas');
sel.addEventListener('change', render);

function warna(v) {
    if (v < 3) return ['rgba(244,63,94,.85)', 'text-rose-600 bg-rose-50'];
    if (v < 4) return ['rgba(245,158,11,.85)', 'text-amber-600 bg-amber-50'];
    return ['rgba(16,185,129,.85)', 'text-emerald-600 bg-emerald-50'];
}

function cetakPDF() {
    document.getElementById('printDate').textContent = 'Dicetak: ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    window.print();
}

async function load() {
    const st = document.getElementById('status');
    st.textContent = 'Memuat data…';
    const { data, error } = await sb.rpc('hasil_evaluasi_publik', { min_responden: MIN_RESPONDEN });
    if (error) { console.error(error); st.textContent = 'Gagal memuat: ' + error.message; return; }
    rows = data.map(r => ({ kelas: r.kelas, mapel: r.mapel, jumlah: Number(r.jumlah), skor: Number(r.skor) }));
    const cur = sel.value;
    const ks = [...new Set(rows.map(r => r.kelas))].sort();
    sel.innerHTML = '<option value="">Semua kelas</option>' + ks.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
    if (ks.includes(cur)) sel.value = cur;
    render();
    st.textContent = 'Diperbarui ' + new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function render() {
    const k = sel.value;
    const list = rows.filter(r => !k || r.kelas === k);
    const tbody = document.getElementById('tbody');
    const box = document.getElementById('interpretasi');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="px-5 py-8 text-center text-slate-500 font-medium">Belum ada data.</td></tr>';
        document.getElementById('sumAvg').textContent = '-';
        document.getElementById('sumCount').textContent = '0';
        box.textContent = 'Belum ada data yang cukup untuk memberikan insight dan analisis.';
        if (chart) { chart.destroy(); chart = null; }
        return;
    }
    const total = list.reduce((t, r) => t + r.jumlah, 0);
    const avg = list.reduce((t, r) => t + r.skor * r.jumlah, 0) / total;
    document.getElementById('sumAvg').textContent = avg.toFixed(2);
    document.getElementById('sumCount').textContent = total;
    tbody.innerHTML = list.map(r => `<tr class="hover:bg-slate-50/50"><td class="px-5 py-4 font-semibold text-slate-700 whitespace-nowrap">${esc(r.kelas)}</td><td class="px-5 py-4 font-medium text-slate-700 whitespace-nowrap">${esc(r.mapel)}</td><td class="px-5 py-4 text-center text-slate-600">${r.jumlah}</td><td class="px-5 py-4 text-center"><span class="px-3 py-1 rounded-full font-bold ${warna(r.skor)[1]}">${r.skor.toFixed(2)}</span></td></tr>`).join('');

    const sorted = [...list].sort((a, b) => b.skor - a.skor);
    const hi = sorted[0], lo = sorted[sorted.length - 1];
    const nama = r => esc(k ? r.mapel : r.kelas + ' - ' + r.mapel);
    let txt = `<p>Dari <strong>${total}</strong> penilaian, skor rata-rata keseluruhan adalah <strong>${avg.toFixed(2)}</strong> dari 5.00.</p><ul class="mt-3 space-y-2">`;
    if (hi.skor >= 3.5) txt += `<li>🏆 <strong>Apresiasi:</strong> kinerja tertinggi diraih oleh <strong>${nama(hi)}</strong> (skor ${hi.skor.toFixed(2)}).</li>`;
    if (lo.skor < 3.5) txt += `<li>💡 <strong>Fokus perbaikan:</strong> <strong>${nama(lo)}</strong> memiliki skor terendah (${lo.skor.toFixed(2)}).</li>`;
    box.innerHTML = txt + '</ul>';

    document.getElementById('chartWrap').style.height = Math.max(220, list.length * 38 + 70) + 'px';
    if (chart) chart.destroy();
    Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
    chart = new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
            labels: list.map(r => k ? r.mapel : r.kelas + ' - ' + r.mapel),
            datasets: [{ data: list.map(r => r.skor), backgroundColor: list.map(r => warna(r.skor)[0]), borderRadius: 6, borderSkipped: false, barPercentage: 0.7 }]
        },
        options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true, max: 5, grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } }
        }
    });
}
load();
</script>
</body>
</html>
