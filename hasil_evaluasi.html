<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Evaluasi Pembelajaran</title>
<link rel="stylesheet" href="tailwind.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc}</style>
</head>
<body class="text-slate-800 antialiased p-4 sm:p-6">
<div class="max-w-4xl mx-auto space-y-6">
  <header class="flex items-center gap-4">
    <img src="logo-sekolah.png" alt="Logo" class="h-14 w-auto" onerror="this.style.display='none'">
    <div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Hasil Evaluasi Pembelajaran</h1>
      <p class="text-sm text-slate-500 font-medium">Skor rata-rata dari penilaian siswa (skala 1–5)</p>
    </div>
  </header>

  <div class="flex flex-wrap items-center gap-3">
    <select id="filterKelas" class="px-4 py-2.5 border border-slate-300 rounded-xl bg-white font-medium text-slate-700 outline-none focus:ring-4 focus:ring-indigo-500/20"></select>
    <button onclick="load()" class="px-4 py-2.5 bg-white border border-slate-300 rounded-xl font-semibold text-slate-600 hover:bg-slate-50">Muat ulang</button>
    <span id="status" class="text-xs font-medium text-slate-400"></span>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="bg-white rounded-2xl border border-slate-200 p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-400">Skor rata-rata</p><p id="sumAvg" class="text-3xl font-extrabold text-indigo-600 mt-1">-</p></div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-400">Jumlah penilaian</p><p id="sumCount" class="text-3xl font-extrabold text-slate-700 mt-1">-</p></div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6">
    <div id="chartWrap" style="position:relative;height:260px"><canvas id="chart"></canvas></div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 text-slate-600 uppercase tracking-wider text-left">
        <tr><th class="px-5 py-3 font-bold">Kelas</th><th class="px-5 py-3 font-bold">Mata Pelajaran</th><th class="px-5 py-3 font-bold text-center">Penilaian</th><th class="px-5 py-3 font-bold text-center">Skor (/5)</th></tr>
      </thead>
      <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tjfmiqdbijppkhimywrd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZm1pcWRiaWpwcGtoaW15d3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MzQ3NzcsImV4cCI6MjEwODQxMDc3N30.wIGUYbV1pnyyNc7M_IR3JluBU8YgwZtY9OpZ_W_jkPk';
// Hanya tampilkan mapel yang sudah dinilai minimal sekian orang (naikkan agar lebih terjaga, mis. 3 atau 5)
const MIN_RESPONDEN = 1;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [], chart = null;
const sel = document.getElementById('filterKelas');
sel.addEventListener('change', render);

function warna(v) {
    if (v < 3) return ['rgba(244,63,94,.85)', 'text-rose-600 bg-rose-50'];
    if (v < 4) return ['rgba(245,158,11,.85)', 'text-amber-600 bg-amber-50'];
    return ['rgba(16,185,129,.85)', 'text-emerald-600 bg-emerald-50'];
}

async function load() {
    const st = document.getElementById('status');
    st.textContent = 'Memuat data…';
    const { data, error } = await sb.rpc('hasil_evaluasi_publik', { min_responden: MIN_RESPONDEN });
    if (error) { console.error(error); st.textContent = 'Gagal memuat data.'; return; }
    rows = data.map(r => ({ kelas: r.kelas, mapel: r.mapel, jumlah: Number(r.jumlah), skor: Number(r.skor) }));
    const cur = sel.value;
    const ks = [...new Set(rows.map(r => r.kelas))].sort();
    sel.innerHTML = '<option value="">Semua kelas</option>' + ks.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
    if (ks.includes(cur)) sel.value = cur;
    render();
    st.textContent = 'Diperbarui ' + new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function render() {
    const k = sel.value;
    const list = rows.filter(r => !k || r.kelas === k);
    const tbody = document.getElementById('tbody');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="px-5 py-8 text-center text-slate-500 font-medium">Belum ada data.</td></tr>';
        document.getElementById('sumAvg').textContent = '-';
        document.getElementById('sumCount').textContent = '0';
        if (chart) { chart.destroy(); chart = null; }
        return;
    }
    const total = list.reduce((t, r) => t + r.jumlah, 0);
    const avg = list.reduce((t, r) => t + r.skor * r.jumlah, 0) / total;
    document.getElementById('sumAvg').textContent = avg.toFixed(2);
    document.getElementById('sumCount').textContent = total;
    tbody.innerHTML = list.map(r => `<tr><td class="px-5 py-3 font-semibold text-slate-700 whitespace-nowrap">${esc(r.kelas)}</td><td class="px-5 py-3 font-medium text-slate-700 whitespace-nowrap">${esc(r.mapel)}</td><td class="px-5 py-3 text-center text-slate-600">${r.jumlah}</td><td class="px-5 py-3 text-center"><span class="px-3 py-1 rounded-full font-bold ${warna(r.skor)[1]}">${r.skor.toFixed(2)}</span></td></tr>`).join('');

    document.getElementById('chartWrap').style.height = Math.max(200, list.length * 38 + 70) + 'px';
    if (chart) chart.destroy();
    Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
    chart = new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
            labels: list.map(r => k ? r.mapel : r.kelas + ' - ' + r.mapel),
            datasets: [{ data: list.map(r => r.skor), backgroundColor: list.map(r => warna(r.skor)[0]), borderRadius: 6, barPercentage: 0.7 }]
        },
        options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true, max: 5, grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } }
        }
    });
}
load();
</script>
</body>
</html>
